name: Build and Deploy

on:
  push:
    branches: [ '**' ]
    tags: [ '*' ]
  pull_request:
    branches: [ '**' ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --openssl-legacy-provider

    steps:
    - uses: actions/checkout@v3
    
    - name: Setup Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '26.11.1'
        cache: 'npm'
        
    - name: Install Angular CLI
      run: npm install -g @angular/cli@10.0.5
      
    - name: Install dependencies
      run: npm install
      
    - name: Setup Chrome
      uses: browser-actions/setup-chrome@v1
      
    # - name: Run tests
      # run: npm run test -- --no-watch --no-progress --browsers=ChromeHeadlessCI
      
    - name: Build
      run: ng build --prod

    - name: Package dist for release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      id: release_package
      run: |
        BRANCH="${GITHUB_REF#refs/heads/}"
        # Git tags cannot contain '/'; use this for tag + asset name
        SANITIZED="${BRANCH//\//-}"
        ZIP="${SANITIZED}.zip"
        zip -r "$ZIP" dist/
        echo "tag=${SANITIZED}" >> "$GITHUB_OUTPUT"
        echo "zip=${ZIP}" >> "$GITHUB_OUTPUT"

    - name: Publish or update branch release
      if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
      uses: ncipollo/release-action@v1
      with:
        tag: ${{ steps.release_package.outputs.tag }}
        name: ${{ github.ref_name }}
        body: |
          Build of `dist/` for branch `${{ github.ref_name }}`.

          - Commit: ${{ github.sha }}
          - Workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        artifacts: ${{ steps.release_package.outputs.zip }}
        token: ${{ secrets.GITHUB_TOKEN }}
        allowUpdates: true
        replacesArtifacts: true
        commit: ${{ github.sha }}
        makeLatest: false
